[package]
name = "tactics-exploration"
version = "0.1.0"
edition = "2024"
default-run = "tactics-exploration"

[dependencies]
anyhow = "1.0.100"
bevy = { version = "0.19.0" }
bevy-inspector-egui = { version = "0.37" }
bevy_common_assets = { version = "0.17.0", features = ["json"] }
# TODO: Remove when https://github.com/StarArawn/bevy_ecs_tilemap/pull/634 lands.
bevy_ecs_tilemap = { git = "https://github.com/taboky-dev/bevy_ecs_tilemap", branch = "bevy-0.19" }
clap = { version = "4.5.53", features = ["derive", "env"] }
image = "0.25.9"
leafwing-input-manager = "0.21.0"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = { version = "2.0" }
# TODO: Remove in place of `EditableText`
bevy_simple_text_input = "0.15.0"
bevy_pkv = "0.16.0"
rand = "0.9.2"
rand_seeder = "0.4.0"
rand_pcg = "0.9.0"
rand_distr = "0.5.1"
bevy_egui = "0.41.0"

# Bevy docs optimizations
# https://bevy.org/learn/quick-start/getting-started/setup/
#
# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
env_logger = "0.11.8"

# https://bevy-cheatbook.github.io/platforms/wasm/size-opt.html
[profile.release-wasm]
inherits = "release"
opt-level = 'z'
lto = "thin"

# Cargo Bundle Settings
[package.metadata.bundle]
name = "Tactics"
identifier = "com.bkdaugherty.tactics"
